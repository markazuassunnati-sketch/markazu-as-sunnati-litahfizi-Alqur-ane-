<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARKAZU-AS-SUNNATI MARADI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#f7f5ee}
.hero{background:linear-gradient(180deg,#0d3d26,#071a11);text-align:center;padding:42px 16px 34px;color:#fff}
.logo-box{width:195px;height:195px;margin:0 auto 22px;border-radius:50%;border:5px solid #f9e27a;box-shadow:0 0 60px rgba(212,175,55,.8),0 0 0 14px rgba(212,175,55,.18);background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.logo-box img{width:100%;height:100%;object-fit:cover;display:block}
.title{font-size:31px;color:#fbe9a0;font-weight:800;line-height:1.1}
.motto{display:flex;align-items:center;gap:10px;justify-content:center;max-width:440px;margin:20px auto 6px}
.motto .line{flex:1;height:1.5px;background:linear-gradient(90deg,transparent,#d4af37,transparent)}
.motto b{color:#f9e27a;letter-spacing:3px;font-size:12px}
.sub{font-size:12px;color:#cbbd8a;margin-top:4px}
.badge{padding:9px 20px;border-radius:30px;font-weight:800;font-size:11px;margin:4px;display:inline-block}
.badge.or{background:linear-gradient(90deg,#b8931f,#f9e27a,#b8931f);color:#1a1200}
.badge.bleu{background:linear-gradient(90deg,#1e5aa8,#3a8de0);color:#fff}
.wrap{max-width:540px;margin:auto;padding:0 12px 50px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-24px 12px 18px}
.stat{background:#fff;border-radius:16px;padding:16px 8px;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.16)}
.stat b{display:block;font-size:22px;color:#0d3d26}
.card{background:#fff;border-radius:22px;padding:22px 16px;margin:18px 0;box-shadow:0 12px 34px rgba(0,0,0,.08)}
.card h2{text-align:center;color:#0d3d26;font-size:22px}
.hr{height:2.5px;background:linear-gradient(90deg,transparent,#d4af37,transparent);margin:14px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}
.item{background:linear-gradient(145deg,#fff,#fdf6d8);border:1.5px solid #e6d5a0;border-radius:14px;padding:16px 10px;text-align:center}
.item b{display:block;font-size:13px;color:#0d3d26}
.infos{background:linear-gradient(145deg,#0f2e1f,#143d2b);color:#f9e27a;border-radius:16px;padding:16px;font-size:12.5px;line-height:1.9;margin-top:16px}
label{font-size:11px;font-weight:800;color:#0d3d26;margin-top:12px;display:block}
input,select{width:100%;padding:12px;border-radius:11px;border:1.8px solid #d9c9a0;background:#fffef8;margin-top:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;background:linear-gradient(90deg,#0d3d26,#1a8a45);color:#fff;padding:16px;border:none;border-radius:14px;font-weight:800;margin-top:18px}
.wa{position:fixed;bottom:18px;right:18px;width:58px;height:58px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.3);z-index:99;text-decoration:none;font-size:28px}
</style>
</head>
