<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARKAZU-AS-SUNNATI MARADI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#f8f9f5}
.hero{background:radial-gradient(ellipse at top,rgba(255,230,120,.45),transparent 60%),linear-gradient(180deg,#0d3d26,#071a11);text-align:center;padding:38px 16px 32px;color:#fff}
.logo-box{width:200px;height:200px;margin:0 auto 20px;border-radius:50%;border:5px solid #f9e27a;box-shadow:0 0 60px rgba(212,175,55,.8),0 0 0 14px rgba(212,175,55,.18);background:#fff;overflow:hidden}
.logo-box svg{width:100%;height:100%}
.title{font-size:30px;color:#fbe9a0;font-weight:800;line-height:1.1}
.motto{display:flex;align-items:center;gap:10px;justify-content:center;margin:20px auto 6px;max-width:420px}
.motto .line{flex:1;height:1.5px;background:linear-gradient(90deg,transparent,#d4af37,transparent)}
.motto b{color:#f9e27a;letter-spacing:3px;font-size:12px}
.sub{font-size:12px;color:#cbbd8a}
.badge{display:inline-block;margin:8px 4px;background:linear-gradient(90deg,#b8931f,#f9e27a,#b8931f);color:#1a1200;padding:8px 18px;border-radius:30px;font-weight:800;font-size:11px}
.badge.bleu{background:linear-gradient(90deg,#1e5aa8,#3a8de0);color:#fff}
.wrap{max-width:520px;margin:auto;padding:0 12px 40px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-22px 12px 18px}
.stat{background:#fff;border-radius:14px;padding:14px 8px;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.stat b{display:block;font-size:20px;color:#0d3d26}
.card{background:#fff;border-radius:20px;padding:20px 16px;margin:16px 0;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.card h2{text-align:center;color:#0d3d26}
.hr{height:2.5px;background:linear-gradient(90deg,transparent,#d4af37,transparent);margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.item{background:linear-gradient(145deg,#fff,#fdf6d8);border:1.5px solid #e6d5a0;border-radius:14px;padding:14px 10px;text-align:center}
.item b{display:block;font-size:13px;color:#0d3d26}
.infos{background:linear-gradient(145deg,#0f2e1f,#143d2b);color:#f9e27a;border-radius:14px;padding:14px;font-size:12px;margin-top:14px;line-height:1.8}
label{font-size:11px;font-weight:700;color:#0d3d26;margin-top:10px;display:block}
input,select{width:100%;padding:11px;border-radius:10px;border:1.5px solid #d9c9a0;margin-top:5px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;background:linear-gradient(90deg,#0d3d26,#1a8a45);color:#fff;padding:14px;border:none;border-radius:12px;font-weight:800;margin-top:14px}
</style>
</head>
